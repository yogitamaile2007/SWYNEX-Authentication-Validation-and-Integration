spring.application.name=student-api
server.port=8080

# API key (override with the API_KEY environment variable)
app.api-key=${API_KEY:change-me-locally}

# H2 in-memory database (works out of the box, no setup needed)
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- To use MySQL like in Task 2, comment out the H2 lines above and use: ----
# spring.datasource.url=jdbc:mysql://localhost:3306/studentdb
# spring.datasource.username=root
# spring.datasource.password=${DB_PASSWORD}
# (and add mysql-connector-j to pom.xml instead of h2)
